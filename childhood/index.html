<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core Memories</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="app">
        <header>
            <div>
                <img class="title-image" id="titleImage" src="assets/core_memories.png" alt="Core Memories" />
            </div>
        </header>

        <div class="stage" id="stage" aria-label="Floating childhood memory bubbles">

                <div class="bubble-field" id="bubbleField" aria-label="Choose a memory">
                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: -18%; --y: 4%; --size: 190px; --delay: -0.5s; --rotate: -6deg; --layer: 3;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 2%; --y: 52%; --size: 150px; --delay: -1.9s; --rotate: 8deg; --layer: 1;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <button class="memory-bubble floating-bubble" type="button" data-scene="0"
                        style="--x: -20%; --y: 18%; --size: 300px; --delay: 0s; --rotate: -12deg;"
                        aria-label="Open memory: getting lost in the grocery store">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                        <img class="bubble-icon" src="assets/grocery_icon.png" alt="" aria-hidden="true" />
                    </button>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 18%; --y: 8%; --size: 165px; --delay: -2.4s; --rotate: -10deg; --layer: 3;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 22%; --y: 72%; --size: 145px; --delay: -3.1s; --rotate: 6deg; --layer: 1;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <button class="memory-bubble floating-bubble" type="button" data-scene="1"
                        style="--x: 10%; --y: 42%; --size: 330px; --delay: -1.4s; --rotate: 9deg;"
                        aria-label="Open memory: drawing on the foggy car window">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                        <img class="bubble-icon" src="assets/car_icon.png" alt="" aria-hidden="true" />
                    </button>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 34%; --y: 64%; --size: 185px; --delay: -0.8s; --rotate: 7deg; --layer: 1;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 42%; --y: 2%; --size: 140px; --delay: -1.1s; --rotate: -7deg; --layer: 3;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <button class="memory-bubble floating-bubble" type="button" data-scene="2"
                        style="--x: 48%; --y: 22%; --size: 340px; --delay: -2.1s; --rotate: -8deg;"
                        aria-label="Open memory: the colorful blanket game">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                        <img class="bubble-icon" src="assets/parachute_icon.png" alt="" aria-hidden="true" />
                    </button>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 70%; --y: 54%; --size: 175px; --delay: -1.2s; --rotate: -5deg; --layer: 3;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 62%; --y: 76%; --size: 150px; --delay: -2.2s; --rotate: 5deg; --layer: 1;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <button class="memory-bubble floating-bubble" type="button" data-scene="3"
                        style="--x: 86%; --y: 30%; --size: 300px; --delay: -0.6s; --rotate: 11deg;"
                        aria-label="Open memory: believing in the tooth fairy">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                        <img class="bubble-icon" src="assets/tooth_icon.png" alt="" aria-hidden="true" />
                    </button>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 98%; --y: 6%; --size: 185px; --delay: -2.8s; --rotate: 9deg; --layer: 3;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 88%; --y: 68%; --size: 160px; --delay: -1.6s; --rotate: -8deg; --layer: 1;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                    <div class="floating-bubble decorative-bubble" aria-hidden="true"
                        style="--x: 106%; --y: 48%; --size: 145px; --delay: -0.9s; --rotate: 10deg; --layer: 3;">
                        <img class="bubble-image" src="assets/bubble.png" alt="" aria-hidden="true" />
                    </div>

                </div>

                <!-- Zoomed memory state -->
                <div class="focus-view" id="focusView" aria-hidden="true">
                    <div class="focus-content" id="focusContent"></div>
                    <button class="back-btn" id="backBtn" type="button" aria-label="Go back">
                        <img class="back-btn-image" src="assets/go_back.png" alt="" aria-hidden="true" />
                    </button>
                </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
